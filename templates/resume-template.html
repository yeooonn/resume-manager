<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{NAME}} 이력서</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #f0f2f5;
      color: #1a1a1a;
      line-height: 1.6;
    }

    /* ── 툴바 (화면 전용) ── */
    .toolbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: #1a1a2e;
      padding: 12px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .toolbar-title { color: #9999bb; font-size: 13px; }
    .download-btn {
      background: #4f46e5;
      color: #fff;
      border: none;
      padding: 8px 22px;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .download-btn:hover { background: #4338ca; }

    /* ── 페이지 래퍼 ── */
    .page-wrapper {
      padding: 72px 24px 48px;
      display: flex;
      justify-content: center;
    }

    /* ── A4 이력서 본문 ── */
    .resume {
      width: 210mm;
      min-height: 297mm;
      background: #fff;
      padding: 20mm 18mm;
      box-shadow: 0 4px 32px rgba(0,0,0,0.10);
    }

    /* 헤더 */
    .resume-header { margin-bottom: 28px; }
    .resume-name { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 4px; }
    .resume-title { font-size: 14px; color: #666; margin-bottom: 10px; }
    .resume-contact {
      font-size: 12.5px; color: #555;
      display: flex; gap: 16px; flex-wrap: wrap;
    }
    .resume-contact a { color: #4f46e5; text-decoration: none; }

    /* 섹션 */
    .section { margin-bottom: 28px; }
    .section-title {
      font-size: 11.5px;
      font-weight: 700;
      color: #4f46e5;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border-bottom: 1.5px solid #e0e0f0;
      padding-bottom: 6px;
      margin-bottom: 16px;
    }

    /* 요약 */
    .summary { font-size: 13.5px; line-height: 1.85; color: #333; }

    /* 경력 */
    .company-block { margin-bottom: 22px; }
    .company-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 2px;
    }
    .company-name { font-size: 15px; font-weight: 700; }
    .period { font-size: 12px; color: #999; }
    .role { font-size: 13px; color: #666; margin-bottom: 12px; }

    /* 프로젝트 */
    .project-block { margin-bottom: 16px; padding-left: 2px; }
    .project-name {
      font-size: 13.5px; font-weight: 600; color: #222;
      margin-bottom: 7px;
      display: flex; align-items: center; gap: 8px;
    }
    .project-name::before {
      content: '';
      display: inline-block;
      width: 3px; height: 13px;
      background: #4f46e5;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .project-desc { font-size: 12px; color: #888; font-weight: 400; }

    ul { padding-left: 14px; }
    li {
      font-size: 13px;
      line-height: 1.8;
      color: #333;
      margin-bottom: 3px;
    }
    li::marker { color: #4f46e5; font-size: 10px; }

    /* 태그 */
    .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .tag {
      background: #f0f0ff; color: #4f46e5;
      padding: 2px 9px; border-radius: 10px;
      font-size: 11px; font-weight: 500;
    }

    /* 기술 스택 */
    .skills-row { font-size: 13px; color: #333; margin-bottom: 6px; }
    .skills-row strong { color: #222; font-weight: 600; }

    /* ── 인쇄 스타일 ── */
    @media print {
      .toolbar { display: none !important; }
      .page-wrapper { padding: 0; background: none; }
      .resume { width: 100%; box-shadow: none; padding: 14mm 14mm; }
      body { background: white; }
      @page { size: A4; margin: 0; }
      .company-block { page-break-inside: avoid; }
      .project-block { page-break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <span class="toolbar-title">이력서 미리보기</span>
    <button class="download-btn" onclick="window.print()">PDF로 다운로드</button>
  </div>

  <div class="page-wrapper">
    <div class="resume">

      <div class="resume-header">
        <div class="resume-name">{{NAME}}</div>
        <div class="resume-title">{{TITLE}}</div>
        <div class="resume-contact">
          <span>{{PHONE}}</span>
          <a href="mailto:{{EMAIL}}">{{EMAIL}}</a>
          <a href="{{GITHUB}}" target="_blank">{{GITHUB}}</a>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Summary</div>
        <div class="summary">{{SUMMARY}}</div>
      </div>

      <div class="section">
        <div class="section-title">Experience</div>
        {{EXPERIENCE_BLOCKS}}
      </div>

      <div class="section">
        <div class="section-title">Projects</div>
        {{PROJECT_BLOCKS}}
      </div>

      <div class="section">
        <div class="section-title">Skills</div>
        {{SKILLS_BLOCK}}
      </div>

    </div>
  </div>
</body>
</html>
